[project]
name = "cdp-aws-tools"
version = "0.1.0"
description = "SQS web tool for listing DLQs and redriving messages"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0",
  "ecs-logging>=2.2.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "moto[sqs]>=5.0.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
