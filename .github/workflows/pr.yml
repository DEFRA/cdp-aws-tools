name: Test Pull Request
on:
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  pull-requests: write
  contents: read

jobs:
  build:
    name: "Test Pull Request"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-2
      AWS_ACCOUNT_ID: "094954420758"
      ECR_IMAGE_NAME: "cdp-aws-tools"
      LOCAL_TAG: "test"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv with caching
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Run tests
        run: uv run --frozen pytest

      - name: Docker Login
        uses: DEFRA/cdp-build-action/docker-login@main
        with:
          iam-role-name: github-ecr-role

      - name: Build image
        uses: DEFRA/cdp-build-action/docker-build/build-image@main
        with:
          image_name: ${{ env.ECR_IMAGE_NAME }}
          tag: ${{ env.LOCAL_TAG }}
